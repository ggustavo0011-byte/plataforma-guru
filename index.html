<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Guru da Elétrica | Projetos e Consultoria NBR 5410</title>
    <meta name="description" content="Plataforma Guru da Elétrica: Suporte personalizado em engenharia, projetos elétricos e consultoria técnica.">
    <meta name="author" content="Gustavo">
    <meta name="robots" content="index, follow">

    <style>
        /* --- ESTILOS GERAIS (ESTILO INSTAGRAM) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
        
        :root {
            --primary: #0095f6;
            --primary-gradient: linear-gradient(135deg, #0095f6 0%, #00c6ff 100%);
            --bg-dark: #000000;
            --bg-card: rgba(26, 26, 26, 0.8);
            --border: #262626;
            --text-main: #fafafa;
            --text-muted: #8e8e8e;
            --danger: #ed4956;
            --success: #4caf50;
        }

        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }
        .oculto { display: none !important; }

        /* --- LOGIN --- */
        .split-screen { display: flex; height: 100vh; width: 100%; }
        .left-side-showcase { flex: 1; position: relative; background: #000; overflow: hidden; }
        .slide-img { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; animation: fade 15s infinite; }
        .slide-img:nth-child(1) { background-image: url('https://images.unsplash.com/photo-1517077304055-6e89abbf09b0?q=80&w=1476'); animation-delay: 0s; }
        .slide-img:nth-child(2) { background-image: url('https://images.unsplash.com/photo-1581092334651-ddf26d9a09d0?q=80&w=1470'); animation-delay: 5s; }
        .slide-img:nth-child(3) { background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1472'); animation-delay: 10s; }
        @keyframes fade { 0%{opacity:0;transform:scale(1);} 10%{opacity:1;transform:scale(1.05);} 33%{opacity:1;transform:scale(1.1);} 43%{opacity:0;} 100%{opacity:0;} }
        .overlay-dark { position: absolute; inset: 0; background: linear-gradient(to right, rgba(0,0,0,0.8), rgba(0,0,0,0.2)); }
        .showcase-content { position: absolute; bottom: 80px; left: 60px; z-index: 2; }
        .showcase-content h1 { font-size: 42px; font-weight: 800; line-height: 1.1; margin-bottom: 15px; }

        .auth-container { flex: 1; display: flex; justify-content: center; align-items: center; background: var(--bg-dark); border-left: 1px solid var(--border); }
        .box { background: var(--bg-dark); border: 1px solid var(--border); padding: 40px; border-radius: 8px; width: 350px; text-align: center; }
        .logo { font-size: 28px; margin-bottom: 30px; font-weight: 700; }
        .logo span { color: var(--primary); }

        /* Mensagens de erro/sucesso no login */
        .auth-msg { font-size: 13px; margin-bottom: 15px; padding: 10px; border-radius: 4px; display: none; }
        .auth-msg.error { background: rgba(237, 73, 86, 0.1); color: var(--danger); display: block; }
        .auth-msg.success { background: rgba(76, 175, 80, 0.1); color: var(--success); display: block; }

        /* --- DASHBOARD LAYOUT --- */
        .app-layout { display: flex; height: 100vh; }
        .sidebar { width: 250px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 25px 15px; display: flex; flex-direction: column; }
        .sidebar-logo { font-size: 22px; font-weight: 800; margin-bottom: 40px; padding-left: 10px; }
        .nav-item { padding: 12px 15px; margin-bottom: 8px; border-radius: 10px; color: var(--text-muted); cursor: pointer; background: none; border: none; width: 100%; text-align: left; font-size: 15px; transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: #1a1a1a; color: #fff; }
        .nav-item.danger { color: var(--danger); margin-top: auto; }

        .main-content { flex: 1; padding: 40px; overflow-y: auto; background: #000; }
        
        /* UI COMPONENTS */
        input { width: 100%; padding: 12px; margin-bottom: 12px; background: #121212; border: 1px solid var(--border); color: #fff; border-radius: 8px; font-size: 14px; }
        button.btn-primary { width: 100%; padding: 12px; background: var(--primary-gradient); border: none; color: #fff; border-radius: 8px; cursor: pointer; font-weight: 700; box-shadow: 0 4px 12px rgba(0,149,246,0.3); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .modal-box { background: #1a1a1a; padding: 30px; border-radius: 12px; border: 1px solid var(--border); width: 400px; max-width: 90%; }
    </style>
</head>
<body>

    <div id="tela-acesso" class="split-screen">
        <div class="left-side-showcase">
            <div class="slide-img"></div><div class="slide-img"></div><div class="slide-img"></div><div class="overlay-dark"></div>
            <div class="showcase-content"><h1>Engenharia<br>na velocidade<br>do digital.</h1></div>
        </div>
        <div class="auth-container">
            <div id="box-login" class="box">
                <h1 class="logo">Guru<span>Elétrica</span></h1>
                <div id="msg-login" class="auth-msg"></div>
                <form id="formLogin">
                    <input type="text" id="login-user" placeholder="Email" required>
                    <input type="password" id="login-pass" placeholder="Senha" required>
                    <button class="btn-primary">Entrar</button>
                </form>
                <div style="margin-top:20px; font-size:13px;">
                    <a href="#" style="color:var(--text-muted); text-decoration:none;" onclick="abrirModalReset()">Esqueceu a senha?</a>
                </div>
                <div style="margin-top:15px; font-size:13px; color:var(--text-muted); border-top: 1px solid var(--border); padding-top: 20px;">
                    Não tem conta? <a href="#" style="color:var(--primary); font-weight:700; text-decoration:none;" onclick="switchAuth('cadastro')">Cadastre-se</a>
                </div>
            </div>
            
            <div id="box-cadastro" class="box oculto">
                <h1 class="logo">Criar Conta</h1>
                <form id="formCadastro">
                    <input type="text" id="cad-nome" placeholder="Nome Completo" required>
                    <input type="email" id="cad-email" placeholder="Email" required>
                    <input type="password" id="cad-pass" placeholder="Senha" required>
                    <button class="btn-primary">Cadastrar</button>
                </form>
                <p style="margin-top:15px; cursor:pointer; font-size:13px; color:var(--text-muted);" onclick="switchAuth('login')">Voltar ao Login</p>
            </div>
        </div>
    </div>

    <div id="modal-reset" class="modal-overlay oculto">
        <div class="modal-box">
            <h3 style="margin-bottom:15px;">Recuperar Senia</h3>
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:20px;">Digite seu e-mail e enviaremos um link para você redefinir sua senha.</p>
            <input type="email" id="email-reset" placeholder="Seu e-mail de cadastro">
            <button class="btn-primary" onclick="enviarLinkReset()">Enviar link de acesso</button>
            <button style="background:none; border:none; color:#fff; width:100%; margin-top:15px; cursor:pointer;" onclick="fecharModalReset()">Voltar</button>
        </div>
    </div>

    <div id="tela-dashboard" class="app-layout oculto">
       <aside class="sidebar"><div class="sidebar-logo">⚡ Guru<span>Elétrica</span></div><button class="nav-item danger" onclick="sair()">Sair</button></aside>
       <main class="main-content"><h2 id="welcome-msg">Bem-vindo</h2></main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDZhPdplfEEPJAN_tvte37k9sXALutykUs",
          authDomain: "gurueletrica-5f494.firebaseapp.com",
          projectId: "gurueletrica-5f494",
          appId: "1:561793673334:web:a68a9a603ae08875c59757"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- LÓGICA DE LOGIN COM MENSAGEM DE ERRO ---
        document.getElementById('formLogin').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            const msgBox = document.getElementById('msg-login');

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                msgBox.className = "auth-msg"; // Limpa erros
            } catch (error) {
                msgBox.innerText = "Usuário ou senha incorretos. Tente novamente.";
                msgBox.className = "auth-msg error";
            }
        };

        // --- LÓGICA ESQUECI MINHA SENHA ---
        window.abrirModalReset = () => document.getElementById('modal-reset').classList.remove('oculto');
        window.fecharModalReset = () => document.getElementById('modal-reset').classList.add('oculto');
        
        window.enviarLinkReset = async () => {
            const email = document.getElementById('email-reset').value;
            if(!email) return alert("Digite seu e-mail");
            try {
                await sendPasswordResetEmail(auth, email);
                alert("Link enviado! Verifique sua caixa de entrada.");
                fecharModalReset();
            } catch (error) {
                alert("E-mail não encontrado.");
            }
        };

        // Controle de Telas
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('tela-acesso').classList.add('oculto');
                document.getElementById('tela-dashboard').classList.remove('oculto');
            } else {
                document.getElementById('tela-dashboard').classList.add('oculto');
                document.getElementById('tela-acesso').classList.remove('oculto');
            }
        });

        window.switchAuth = (tipo) => {
            document.getElementById('box-login').classList.toggle('oculto', tipo === 'cadastro');
            document.getElementById('box-cadastro').classList.toggle('oculto', tipo === 'login');
        };
        window.sair = () => signOut(auth);
    </script>
</body>
</html>
