<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Guru da Elétrica | Projetos e Consultoria NBR 5410</title>
    <meta name="description" content="Plataforma Guru da Elétrica: Suporte personalizado em engenharia, projetos elétricos e consultoria técnica.">
    <meta name="keywords" content="engenharia elétrica, nbr 5410, projetos elétricos, guru da eletrica">
    <meta name="author" content="Gustavo">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="Guru da Elétrica - Seu suporte em Engenharia">
    <meta property="og:description" content="Plataforma moderna para projetos elétricos e suporte técnico.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ggustavo0011-byte.github.io/plataforma-guru/">

    <style>
        /* --- ESTILOS GERAIS (ESTILO INSTAGRAM) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
        
        :root {
            --primary: #0095f6;
            --primary-gradient: linear-gradient(135deg, #0095f6 0%, #00c6ff 100%);
            --bg-dark: #000000;
            --bg-card: rgba(26, 26, 26, 0.8);
            --sidebar: #000000;
            --border: #262626;
            --text-main: #fafafa;
            --text-muted: #8e8e8e;
            --status-analise: #2196f3;
            --status-proposta: #ff9800;
            --status-pago: #4caf50;
            --danger: #ed4956;
        }

        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }
        .oculto { display: none !important; }

        /* --- LOGIN --- */
        .split-screen { display: flex; height: 100vh; width: 100%; }
        .left-side-showcase { flex: 1; position: relative; background: #000; overflow: hidden; }
        .slide-img { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; animation: fade 15s infinite; }
        .slide-img:nth-child(1) { background-image: url('https://images.unsplash.com/photo-1517077304055-6e89abbf09b0?q=80&w=1476'); animation-delay: 0s; }
        .slide-img:nth-child(2) { background-image: url('https://images.unsplash.com/photo-1581092334651-ddf26d9a09d0?q=80&w=1470'); animation-delay: 5s; }
        .slide-img:nth-child(3) { background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1472'); animation-delay: 10s; }
        @keyframes fade { 0%{opacity:0;transform:scale(1);} 10%{opacity:1;transform:scale(1.05);} 33%{opacity:1;transform:scale(1.1);} 43%{opacity:0;} 100%{opacity:0;} }
        .overlay-dark { position: absolute; inset: 0; background: linear-gradient(to right, rgba(0,0,0,0.8), rgba(0,0,0,0.2)); }
        .showcase-content { position: absolute; bottom: 80px; left: 60px; z-index: 2; }
        .showcase-content h1 { font-size: 42px; font-weight: 800; line-height: 1.1; margin-bottom: 15px; }

        .auth-container { flex: 1; display: flex; justify-content: center; align-items: center; background: var(--bg-dark); border-left: 1px solid var(--border); }
        .box { background: var(--bg-dark); border: 1px solid var(--border); padding: 40px; border-radius: 8px; width: 350px; text-align: center; }
        .logo { font-size: 28px; margin-bottom: 30px; font-weight: 700; }
        .logo span { color: var(--primary); }

        /* --- DASHBOARD LAYOUT --- */
        .app-layout { display: flex; height: 100vh; }
        
        .sidebar { width: 250px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 25px 15px; display: flex; flex-direction: column; }
        .sidebar-logo { font-size: 22px; font-weight: 800; margin-bottom: 40px; padding-left: 10px; }
        
        .nav-item { 
            padding: 12px 15px; margin-bottom: 8px; border-radius: 10px; color: var(--text-muted); 
            cursor: pointer; background: none; border: none; width: 100%; text-align: left; 
            font-size: 15px; transition: all 0.2s; font-weight: 500;
        }
        .nav-item:hover { background: #1a1a1a; color: #fff; }
        .nav-item.active { color: #fff; font-weight: 700; background: #1a1a1a; }
        .nav-item.danger { color: var(--danger); margin-top: auto; }

        .main-content { flex: 1; padding: 40px; overflow-y: auto; background: #000; }
        
        /* --- CARDS ESTILO VIDRO --- */
        .guru-hero-card { 
            background: var(--primary-gradient); border-radius: 15px; padding: 25px; 
            display: flex; align-items: center; gap: 20px; margin-bottom: 35px;
            box-shadow: 0 10px 30px rgba(0, 149, 246, 0.2);
        }

        .requests-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        
        .request-card { 
            background: var(--bg-card); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 16px; padding: 20px; 
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .request-card:hover { transform: translateY(-5px); border-color: #444; }

        /* --- UI COMPONENTS --- */
        input, select, textarea { 
            width: 100%; padding: 12px; margin-bottom: 12px; background: #121212; 
            border: 1px solid var(--border); color: #fff; border-radius: 8px; font-size: 14px; 
        }
        
        button.btn-primary, a.btn-primary { 
            width: 100%; padding: 12px; background: var(--primary-gradient); border: none; 
            color: #fff; border-radius: 8px; cursor: pointer; font-weight: 700; 
            transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 12px rgba(0,149,246,0.3);
        }
        button.btn-primary:hover { transform: scale(1.02); box-shadow: 0 6px 18px rgba(0,149,246,0.4); }

        .req-status { padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }

        @media(max-width:900px){ 
            .left-side-showcase { display:none; } 
            .app-layout { flex-direction: column; } 
            .sidebar { width: 100%; flex-direction: row; height: 70px; padding: 10px; border-bottom: 1px solid var(--border); position: fixed; bottom: 0; z-index: 1000; }
            .sidebar-logo { display: none; }
            .main-content { padding-bottom: 100px; }
        }
    </style>
</head>
<body>

    <div id="tela-acesso" class="split-screen">
        <div class="left-side-showcase">
            <div class="slide-img"></div><div class="slide-img"></div><div class="slide-img"></div><div class="overlay-dark"></div>
            <div class="showcase-content"><h1>Engenharia<br>na velocidade<br>do digital.</h1></div>
        </div>
        <div class="auth-container">
            <div id="box-login" class="box">
                <h1 class="logo">Guru<span>Elétrica</span></h1>
                <form id="formLogin">
                    <input type="text" id="login-user" placeholder="Email ou Usuário" required>
                    <input type="password" id="login-pass" placeholder="Senha" required>
                    <button class="btn-primary">Entrar</button>
                </form>
                <div style="margin-top:20px; font-size:13px; color:var(--text-muted);">
                    Não tem uma conta? <a href="#" style="color:var(--primary); font-weight:700; text-decoration:none;" onclick="document.getElementById('box-login').classList.add('oculto');document.getElementById('box-cadastro').classList.remove('oculto')">Cadastre-se</a>
                </div>
            </div>
            
            <div id="box-cadastro" class="box oculto">
                <h1 class="logo">Criar Conta</h1>
                <form id="formCadastro">
                    <input type="text" id="cad-nome" placeholder="Nome Completo" required>
                    <input type="email" id="cad-email" placeholder="Seu melhor Email" required>
                    <input type="tel" id="cad-zap" placeholder="WhatsApp" required>
                    <input type="text" id="cad-curso" placeholder="Curso/Profissão" required>
                    <input type="password" id="cad-pass" placeholder="Senha" required>
                    <button class="btn-primary">Cadastrar</button>
                </form>
                <p style="margin-top:15px; cursor:pointer; font-size:13px; color:var(--text-muted);" onclick="document.getElementById('box-cadastro').classList.add('oculto');document.getElementById('box-login').classList.remove('oculto')">Voltar ao Login</p>
            </div>
        </div>
    </div>

    <div id="tela-dashboard" class="app-layout oculto">
        <aside class="sidebar">
            <div class="sidebar-logo">⚡ Guru<span>Elétrica</span></div>
            <nav style="width:100%">
                <button class="nav-item active" id="nav-pedidos" onclick="switchView('pedidos')">🏠 Home</button>
                <button class="nav-item" onclick="switchView('perfil')">👤 Perfil</button>
                <button class="nav-item oculto" id="nav-config-guru" onclick="switchView('config')">⚙️ Admin</button>
                <button class="nav-item danger" onclick="sair()">🚪 Sair</button>
            </nav>
        </aside>

        <main class="main-content">
            <div id="guru-hero-card" class="guru-hero-card">
                <div id="guru-avatar-img" style="width:70px; height:70px; border-radius:50%; background:#fff; background-size:cover; border:3px solid rgba(255,255,255,0.3);"></div>
                <div>
                    <h2 id="guru-title" style="color:#fff; font-size:20px;">Guru da Elétrica</h2>
                    <p id="guru-subtitle" style="color:rgba(255,255,255,0.8); font-size:13px; margin-bottom:8px;">Consultoria Técnica</p>
                    <button id="btn-ver-quali" style="background:rgba(255,255,255,0.2); border:none; color:#fff; padding:6px 12px; border-radius:6px; font-size:11px; cursor:pointer; font-weight:700;">Ver Qualificações</button>
                </div>
            </div>

            <div id="view-pedidos">
                <div class="tabs-header" style="display:flex; gap:20px; margin-bottom:25px; border-bottom:1px solid var(--border);">
                    <button class="tab-link active" onclick="filtrar('aberto', this)" style="background:none; border:none; color:inherit; padding-bottom:10px; cursor:pointer;">Ativos</button>
                    <button class="tab-link" onclick="filtrar('finalizado', this)" style="background:none; border:none; color:inherit; padding-bottom:10px; cursor:pointer;">Concluídos</button>
                </div>
                
                <button class="btn-primary" id="btn-novo-pedido" style="width:auto; padding:10px 25px; margin-bottom:30px;" onclick="document.getElementById('modal-pedido').classList.remove('oculto')">+ Iniciar Projeto</button>
                
                <div id="lista-pedidos" class="requests-grid"></div>
            </div>

            <div id="view-perfil" class="oculto">
                <div class="box" style="width:100%; text-align:left;">
                    <h3 style="margin-bottom:20px;">Meu Perfil</h3>
                    <form id="formPerfilAluno">
                        <label style="font-size:12px; color:var(--text-muted);">Nome</label><input type="text" id="perf-nome">
                        <label style="font-size:12px; color:var(--text-muted);">WhatsApp</label><input type="text" id="perf-zap">
                        <label style="font-size:12px; color:var(--text-muted);">Curso/Área</label><input type="text" id="perf-curso">
                        <button class="btn-primary">Salvar Alterações</button>
                    </form>
                </div>
            </div>
            
            <div id="view-perfil-guru" class="oculto">
                <h3>Configurações do Guru</h3>
                <form id="formPerfilGuruEdit" style="max-width:500px; margin-top:20px;">
                    <input type="hidden" id="conf-img-base64">
                    <label>Título</label><input type="text" id="conf-titulo">
                    <label>Subtítulo</label><input type="text" id="conf-sub">
                    <label>Bio</label><textarea id="conf-bio" style="height:100px;"></textarea>
                    <button class="btn-primary" id="btn-save-perf-guru">Atualizar Perfil Público</button>
                </form>
            </div>
        </main>
    </div>

    <div id="modal-pedido" class="modal-overlay oculto">
        <div class="modal-box">
            <h3 style="margin-bottom:20px;">Detalhes do Projeto</h3>
            <form id="formPedido">
                <input id="ped-materia" placeholder="Área (Ex: Residencial, Industrial)" required>
                <input id="ped-titulo" placeholder="Título do Projeto" required>
                <textarea id="ped-desc" placeholder="Descreva o que você precisa..." style="height:120px;" required></textarea>
                <label for="ped-file" class="custom-file-upload" style="border: 2px dashed #333; padding: 20px; text-align: center; display: block; border-radius: 10px; cursor: pointer; color: var(--text-muted);">
                    Clique para anexar arquivos (PDF/IMG)
                </label>
                <input type="file" id="ped-file" style="display:none;">
                <div id="file-name-display" style="font-size:12px; text-align:center; margin-top:10px;"></div>
                <button class="btn-primary" style="margin-top:20px;">Enviar Solicitação</button>
            </form>
            <button class="btn-secondary" style="background:none; border:none; color:var(--danger); width:100%; margin-top:10px; cursor:pointer;" onclick="fecharModal(this)">Cancelar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, updateDoc, doc, setDoc, getDoc, deleteDoc, where } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDZhPdplfEEPJAN_tvte37k9sXALutykUs",
          authDomain: "gurueletrica-5f494.firebaseapp.com",
          projectId: "gurueletrica-5f494",
          storageBucket: "gurueletrica-5f494.firebasestorage.app",
          messagingSenderId: "561793673334",
          appId: "1:561793673334:web:a68a9a603ae08875c59757"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app); 

        const GURU_EMAIL = "ggustavo0011@gmail.com";
        let usuarioAtual = null;
        let filtroAtual = 'aberto';

        // Autenticação
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const s = await getDoc(doc(db, "usuarios", user.uid));
                const d = s.exists() ? s.data() : {};
                usuarioAtual = { uid: user.uid, email: user.email, ...d, role: user.email === GURU_EMAIL ? 'guru' : 'student' };
                document.getElementById('tela-acesso').classList.add('oculto');
                document.getElementById('tela-dashboard').classList.remove('oculto');
                iniciarApp();
            } else {
                document.getElementById('tela-dashboard').classList.add('oculto');
                document.getElementById('tela-acesso').classList.remove('oculto');
            }
        });

        function iniciarApp() {
            document.getElementById('welcome-msg').innerText = `Olá, ${usuarioAtual.nome?.split(' ')[0] || 'Usuário'}`;
            document.getElementById('nav-config-guru').classList.toggle('oculto', usuarioAtual.role !== 'guru');
            document.getElementById('btn-novo-pedido').classList.toggle('oculto', usuarioAtual.role === 'guru');
            carregarPedidos();
            carregarPerfilGuru();
        }

        function carregarPedidos() {
            const q = usuarioAtual.role === 'guru' 
                ? query(collection(db, "pedidos"), orderBy("data", "desc"))
                : query(collection(db, "pedidos"), where("emailAluno", "==", usuarioAtual.email));

            onSnapshot(q, (snap) => {
                const lista = document.getElementById('lista-pedidos');
                lista.innerHTML = "";
                snap.forEach(d => {
                    const p = d.data();
                    const card = document.createElement('div');
                    card.className = 'request-card';
                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                            <span style="font-size:11px; color:var(--text-muted)">${p.materia}</span>
                            <span class="req-status" style="background:rgba(0,149,246,0.1); color:var(--primary)">${p.status}</span>
                        </div>
                        <h4 style="margin-bottom:8px;">${p.titulo}</h4>
                        <p style="font-size:13px; color:var(--text-muted); margin-bottom:15px;">${p.desc}</p>
                        ${p.proposta ? `<div style="font-weight:700; color:var(--status-pago)">R$ ${p.proposta.valor}</div>` : ''}
                    `;
                    lista.appendChild(card);
                });
            });
        }

        async function carregarPerfilGuru() {
            const d = await getDoc(doc(db, "config_site", "perfil_guru"));
            if (d.exists()) {
                const data = d.data();
                document.getElementById('guru-title').innerText = data.titulo || "Guru da Elétrica";
                document.getElementById('guru-subtitle').innerText = data.sub || "Consultoria";
                if(data.imgBase64) document.getElementById('guru-avatar-img').style.backgroundImage = `url(${data.imgBase64})`;
            }
        }

        // Funções Globais
        window.switchView = (v) => {
            document.querySelectorAll('.main-content > div').forEach(el => el.classList.add('oculto'));
            document.getElementById('view-' + v).classList.remove('oculto');
        };
        window.fecharModal = (btn) => btn.closest('.modal-overlay').classList.add('oculto');
        window.sair = () => signOut(auth);

        // Formulários
        document.getElementById('formLogin').onsubmit = (e) => {
            e.preventDefault();
            signInWithEmailAndPassword(auth, document.getElementById('login-user').value, document.getElementById('login-pass').value);
        };

        document.getElementById('formPedido').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "pedidos"), {
                titulo: document.getElementById('ped-titulo').value,
                materia: document.getElementById('ped-materia').value,
                desc: document.getElementById('ped-desc').value,
                emailAluno: usuarioAtual.email,
                data: Date.now(),
                status: 'Em Análise'
            });
            fecharModal(document.getElementById('formPedido'));
            alert("Solicitação enviada!");
        };
    </script>
</body>
</html>
